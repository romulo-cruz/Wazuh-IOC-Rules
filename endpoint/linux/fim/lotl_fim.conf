<syscheck>
  <!-- Arquivos críticos do sistema -->
  <directories check_all="yes" realtime="yes">/etc/passwd,/etc/shadow,/etc/group</directories>
  
  <!-- Diretórios temporários -->
  <directories check_all="yes" realtime="yes">/tmp,/var/tmp</directories>
  
  <!-- Binários do sistema -->
  <directories check_all="yes" realtime="yes">/bin,/sbin,/usr/bin,/usr/sbin</directories>

  <!-- Configuração de frequência -->
  <frequency>300</frequency>
  
  <!-- Ignorar arquivos temporários legítimos -->
  <ignore type="sregex">^/tmp/.*\.tmp$</ignore>
  
  <!-- Alertas para modificações específicas -->
  <alert_new_files>yes</alert_new_files>
  <alert_modified_files>yes</alert_modified_files>
  <alert_deleted_files>yes</alert_deleted_files>
</syscheck> 