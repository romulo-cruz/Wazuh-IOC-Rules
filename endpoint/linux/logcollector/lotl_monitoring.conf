<!-- Monitoramento de processos -->
<localfile>
  <log_format>full_command</log_format>
  <command>ps -eo pid,ppid,user,args --forest</command>
  <alias>process_monitoring</alias>
  <frequency>60</frequency>
</localfile>

<!-- Monitoramento de conexões de rede -->
<localfile>
  <log_format>full_command</log_format>
  <command>netstat -tulpn</command>
  <alias>network_connections</alias>
  <frequency>60</frequency>
</localfile>

<!-- Monitoramento de arquivos abertos -->
<localfile>
  <log_format>full_command</log_format>
  <command>lsof -i -n -P</command>
  <alias>open_files</alias>
  <frequency>60</frequency>
</localfile> 