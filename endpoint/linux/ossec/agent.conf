<agent_config os="linux">
  <!-- Monitoramento de força bruta SSH -->
  <localfile>
    <log_format>full_command</log_format>
    <command>ss -nputw | grep -c ':22 ' | awk -F: '$0 > 4'</command>
    <alias>Verificando SSH de saída</alias>
    <frequency>60</frequency>
  </localfile>

  <!-- Monitoramento de porta P2P -->
  <localfile>
    <log_format>full_command</log_format>
    <command>netstat -lno | grep ':1919 '</command>
    <alias>Detectando comunicação possível de botnet</alias>
    <frequency>60</frequency>
  </localfile>

  <!-- Monitoramento de binário malicioso -->
  <localfile>
    <log_format>full_command</log_format>
    <command>find /.* -maxdepth 1 -name xinetd -type f</command>
    <alias>Procurando binário Panchan</alias>
    <frequency>300</frequency>
  </localfile>

  <!-- Monitoramento de persistência -->
  <localfile>
    <log_format>full_command</log_format>
    <command>find /lib/ /bin/ -name systemd-worker* -type f</command>
    <alias>Verificando persistência Panchan</alias>
    <frequency>300</frequency>
  </localfile>

  <!-- Monitoramento de mineração -->
  <localfile>
    <log_format>full_command</log_format>
    <command>ps aux | grep -E "xinetd|systemd-worker" | grep -v grep</command>
    <alias>Verificando processos de mineração</alias>
    <frequency>60</frequency>
  </localfile>
</agent_config> 