<ossec_config>
  <!-- Monitoramento de Sistema -->
  <syscheck>
    <directories check_all="yes" realtime="yes">/home</directories>
    <directories check_all="yes" realtime="yes">/tmp</directories>
    <directories check_all="yes" realtime="yes">/var/tmp</directories>
  </syscheck>

  <!-- Monitoramento de módulos do kernel -->
  <localfile>
    <log_format>syslog</log_format>
    <location>/var/log/kern.log</location>
  </localfile>

  <!-- Monitoramento de capabilities -->
  <localfile>
    <log_format>syslog</log_format>
    <location>/var/log/auth.log</location>
  </localfile>

  <!-- Resposta Ativa -->
  <active-response>
    <disabled>no</disabled>
    <command>webshell_cleanup</command>
    <location>local</location>
    <rules_id>100510,100512,100513</rules_id>
    <timeout>300</timeout>
  </active-response>

  <!-- Monitoramento FIM -->
  <syscheck>
    <directories check_all="yes">/lib/modules</directories>
    <directories check_all="yes">/proc/kallsyms</directories>
    <directories check_all="yes" realtime="yes">/var/www/html</directories>
  </syscheck>

  <!-- Verificação de Vulnerabilidades -->
  <vulnerability-detector>
    <enabled>yes</enabled>
    <interval>1h</interval>
    <ignore_time>6h</ignore_time>
    <run_on_start>yes</run_on_start>

    <!-- Feeds de vulnerabilidades -->
    <provider name="canonical">
      <enabled>yes</enabled>
      <os>trusty</os>
      <os>xenial</os>
      <os>bionic</os>
      <os>focal</os>
      <os>jammy</os>
      <update_interval>1h</update_interval>
    </provider>

    <provider name="debian">
      <enabled>yes</enabled>
      <os>stretch</os>
      <os>buster</os>
      <os>bullseye</os>
      <update_interval>1h</update_interval>
    </provider>

    <provider name="redhat">
      <enabled>yes</enabled>
      <os>5</os>
      <os>6</os>
      <os>7</os>
      <os>8</os>
      <os>9</os>
      <update_interval>1h</update_interval>
    </provider>
  </vulnerability-detector>

  <!-- System Configuration Assessment -->
  <sca>
    <enabled>yes</enabled>
    <scan_on_start>yes</scan_on_start>
    <interval>12h</interval>
    <skip_nfs>yes</skip_nfs>
  </sca>

  <!-- Monitoramento de Arquivos -->
  <syscheck>
    <directories check_all="yes">/etc/cups</directories>
    <directories check_all="yes">/var/spool/cups</directories>
  </syscheck>

  <!-- Incluir configurações do Logcollector -->
  <include>logcollector/xz_utils_monitoring.xml</include>

  <!-- Monitoramento de arquivos críticos -->
  <syscheck>
    <directories check_all="yes" realtime="yes">/lib64/liblzma.so*</directories>
    <directories check_all="yes" realtime="yes">/usr/lib64/liblzma.so*</directories>
  </syscheck>

  <!-- Monitoramento de Comandos -->
  <localfile>
    <log_format>full_command</log_format>
    <command>ss -nputw | egrep '"sh"|"bash"|"csh"|"ksh"|"zsh"' | awk '{ print $5 "|" $6 }'</command>
    <alias>webshell connections</alias>
    <frequency>120</frequency>
  </localfile>
</ossec_config> 