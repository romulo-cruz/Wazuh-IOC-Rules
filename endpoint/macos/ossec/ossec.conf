<ossec_config>
  <!-- Monitoramento de Sistema -->
  <syscheck>
    <directories check_all="yes" realtime="yes">/Users</directories>
    <directories check_all="yes" realtime="yes">/private/tmp</directories>
    <directories check_all="yes" realtime="yes">/private/var/tmp</directories>
  </syscheck>

  <!-- Log Analysis -->
  <localfile>
    <log_format>syslog</log_format>
    <location>/var/log/system.log</location>
  </localfile>
</ossec_config> 