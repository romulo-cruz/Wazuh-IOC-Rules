<ossec_config>
  <!-- Monitoramento Sysmon -->
  <localfile>
    <location>Microsoft-Windows-Sysmon/Operational</location>
    <log_format>eventchannel</log_format>
  </localfile>

  <!-- Monitoramento PowerShell -->
  <localfile>
    <location>Microsoft-Windows-PowerShell/Operational</location>
    <log_format>eventchannel</log_format>
  </localfile>

  <!-- Resposta Ativa -->
  <active-response>
    <command>blacksuit_recovery</command>
    <location>local</location>
    <rules_id>100011,100012,100013</rules_id>
    <timeout>600</timeout>
  </active-response>

  <!-- SCA -->
  <sca>
    <policies>
      <policy>C:\Program Files (x86)\sca_policies\snake_keylogger_check.yml</policy>
    </policies>
  </sca>

  <!-- Integração YARA -->
  <command>
    <name>yara</name>
    <executable>yara.bat</executable>
    <timeout_allowed>no</timeout_allowed>
  </command>

  <!-- FIM -->
  <syscheck>
    <directories check_all="yes">C:\Users\*\Downloads</directories>
    <ignore type="sregex">.+\.blacksuit$</ignore>
    <windows_registry>HKEY_LOCAL_MACHINE\SOFTWARE\Microsoft\Windows Defender\Exclusions</windows_registry>
    <windows_registry>HKEY_LOCAL_MACHINE\Software\Policies\Microsoft\Windows\PowerShell</windows_registry>
  </syscheck>
</ossec_config> 