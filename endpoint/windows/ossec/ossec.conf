<ossec_config>
  <!-- Configuração do Sysmon -->
  <localfile>
    <location>Microsoft-Windows-Sysmon/Operational</location>
    <log_format>eventchannel</log_format>
  </localfile>

  <!-- Monitoramento de Diretórios -->
  <syscheck>
    <directories check_all="yes" realtime="yes">C:\Users\*\Downloads</directories>
    <directories check_all="yes" realtime="yes">C:\Users\*\Documents</directories>
    <directories check_all="yes" realtime="yes">C:\Users\*\Desktop</directories>
    <ignore type="sregex">.dll$|.exe$|.msi$|.lynx$|.sYMY1N6ah$</ignore>
    <!-- Monitorar pasta de instalação do malware -->
    <directories check_all="yes" realtime="yes">%AppData%\Skillbrains\lightshot</directories>
    
    <!-- Monitorar registro para persistência -->
    <windows_registry>HKEY_CURRENT_USER\Software\Microsoft\Windows\CurrentVersion\Run</windows_registry>
    
    <!-- Monitorar shadow copies -->
    <windows_registry>HKEY_LOCAL_MACHINE\SYSTEM\CurrentControlSet\Services\VSS</windows_registry>
    
    <!-- Monitorar Windows Defender -->
    <windows_registry>HKEY_LOCAL_MACHINE\SOFTWARE\Microsoft\Windows Defender</windows_registry>

    <!-- Monitoramento FIM -->
    <directories check_all="yes" realtime="yes">%APPDATA%</directories>
    <directories check_all="yes" realtime="yes">%LOCALAPPDATA%</directories>
    <directories check_all="yes" realtime="yes">%LOCALAPPDATA%\Temp</directories>
    
    <!-- Monitorar boot configuration -->
    <windows_registry>HKEY_LOCAL_MACHINE\SYSTEM\CurrentControlSet\Control\Session Manager\Boot</windows_registry>

    <!-- Monitorar tarefas agendadas -->
    <directories check_all="yes">C:\Windows\System32\Tasks</directories>

    <!-- Monitorar registro -->
    <windows_registry>HKEY_CURRENT_USER\SOFTWARE\Microsoft\Windows\CurrentVersion\Explorer\User Shell Folders</windows_registry>

    <!-- Novos diretórios para o njRAT -->
    <directories check_all="yes" realtime="yes">%APPDATA%\Microsoft\Windows\Start Menu\Programs\Startup</directories>

    <!-- Monitorar pasta Temp -->
    <directories check_all="yes" realtime="yes">%TEMP%</directories>
    
    <!-- Monitorar registro -->
    <windows_registry>HKEY_CURRENT_USER\Software\Microsoft\Windows\DWM</windows_registry>
    <windows_registry>HKEY_USERS\*\Software\Microsoft\Windows\DWM</windows_registry>

    <!-- Monitorar todos os drives -->
    <directories check_all="yes" realtime="yes">C:\</directories>
    <directories check_all="yes" realtime="yes">D:\</directories>
    <directories check_all="yes" realtime="yes">E:\</directories>
    
    <!-- Monitorar eventos do sistema -->
    <windows_audit_interval>300</windows_audit_interval>

    <!-- Resposta Ativa -->
    <windows_registry>HKEY_CURRENT_USER\SOFTWARE</windows_registry>

    <!-- Resposta Ativa -->
    <windows_registry>HKEY_LOCAL_MACHINE\SYSTEM\CurrentControlSet\Services\LanmanServer\Parameters</windows_registry>
    <windows_registry>HKEY_LOCAL_MACHINE\SYSTEM\CurrentControlSet\Control\Session Manager\Memory Management</windows_registry>

    <!-- Novo diretório para Web Shells -->
    <directories check_all="yes" realtime="yes">C:\inetpub\wwwroot</directories>
  </syscheck>

  <!-- Active Response -->
  <active-response>
    <disabled>no</disabled>
    <ca_store>wpk_root.pem</ca_store>
    <ca_verification>yes</ca_verification>
  </active-response>

  <!-- Integração YARA -->
  <command>
    <name>yara</name>
    <executable>yara.bat</executable>
    <timeout_allowed>no</timeout_allowed>
  </command>

  <active-response>
    <name>njrat_cleanup</name>
    <command>njrat_cleanup</command>
    <location>local</location>
    <rules_id>100201,100202,100203,100204</rules_id>
    <timeout>300</timeout>
  </active-response>

  <!-- Configuração de resposta ativa -->
  <command>
    <name>rollback_windows</name>
    <executable>rollback.bat</executable>
    <timeout_allowed>no</timeout_allowed>
  </command>

  <active-response>
    <command>rollback_windows</command>
    <location>local</location>
    <rules_id>100700,100701,100702,100703</rules_id>
    <timeout>600</timeout>
  </active-response>

  <!-- Resposta Ativa -->
  <command>
    <name>braincipher_response</name>
    <executable>braincipher_response.bat</executable>
    <timeout_allowed>no</timeout_allowed>
  </command>

  <active-response>
    <command>braincipher_response</command>
    <location>local</location>
    <rules_id>100121,100122,100123,100124</rules_id>
  </active-response>

  <!-- Resposta Ativa -->
  <command>
    <name>remove-lumma</name>
    <executable>remove_lumma.bat</executable>
    <timeout_allowed>no</timeout_allowed>
  </command>

  <active-response>
    <command>remove-lumma</command>
    <location>local</location>
    <rules_id>100501,100502,100503,100504</rules_id>
    <timeout>600</timeout>
  </active-response>

  <!-- Resposta Ativa -->
  <command>
    <name>remove-latrodectus</name>
    <executable>remove_latrodectus.bat</executable>
    <timeout_allowed>no</timeout_allowed>
  </command>

  <active-response>
    <command>remove-latrodectus</command>
    <location>local</location>
    <rules_id>100900,100901,100902,100903</rules_id>
    <timeout>600</timeout>
  </active-response>

  <!-- Integração VirusTotal -->
  <integration>
    <name>virustotal</name>
    <api_key>YOUR_API_KEY</api_key>
    <rule_id>554,550</rule_id>
    <alert_format>json</alert_format>
  </integration>

  <!-- Configuração SCA -->
  <sca>
    <enabled>yes</enabled>
    <scan_on_start>yes</scan_on_start>
    <interval>12h</interval>
    <skip_nfs>yes</skip_nfs>

    <policies>
      <policy>%WINDIR%\sca_policies\purehvnc_check.yml</policy>
    </policies>
  </sca>

