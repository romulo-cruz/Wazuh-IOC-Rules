policy:
  id: "dirty_pipe_vulnerability_check"
  file: "dirty_pipe_check_vulnerability.yml"
  name: "Verificação de vulnerabilidade Dirty Pipe"
  description: "Este documento fornece orientações para identificar a vulnerabilidade Dirty Pipe"
  references:
    - https://nvd.nist.gov/vuln/detail/CVE-2022-0847

requirements:
  title: "Verificar se a versão do kernel pode ser extraída com o comando uname"
  description: "Requisitos para executar a verificação SCA em endpoints Linux."
  condition: all
  rules:
    - 'c:sh -c "uname -r" -> r:^\d.\d+'

checks:
  - id: 10000
    title: "Garantir que a versão do kernel Linux esteja abaixo de 5.8 ou seja 5.16.11, 5.15.25 ou 5.10.102"
    description: "O kernel Linux é vulnerável ao Dirty Pipe (CVE-2022-0847) nas versões 5.8 e superiores, exceto 5.16.11, 5.15.25 e 5.10.102"
    remediation: "Atualizar o kernel Linux para a versão 5.16.11, 5.15.25 ou 5.10.102 ou aplicar um patch"
    condition: any
    rules:
      - 'c:uname -r -> r:^1.|^2.|^3.|^4.|^5.0(.|-|$)|^5.1(.|-|$)|^5.2(.|-|$)|^5.3(.|-|$)|^5.4(.|-|$)|^5.5(.|-|$)|^5.6(.|-|$)|^5.7(.|-|$)|^5.10.102|^5.10.92|^5.15.25|^5.(([1-9][6-9])|([2-9][0-9])).(([1-9][1-9])|([2-9][0-9]))|^5.(([1-9][7-9])|([2-9][0-9]))' 